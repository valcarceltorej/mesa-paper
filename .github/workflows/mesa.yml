name: Mesa paper
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de ejecucion (10 = diagnostico)"
        default: "10"
permissions:
  contents: write
concurrency:
  group: mesa
jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests websockets
      - run: python real.py ${{ github.event.inputs.minutos || '330' }}
      - if: always()
        run: |
          git config user.name "mesa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos_mesa
          git commit -m "Resultados mesa" || echo "Sin cambios"
          git pull --rebase
          git push
